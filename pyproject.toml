[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clausegym"
version = "0.1.0"
description = "RL environment for versioned federal compliance (FAR/DFARS)"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]",
    "pgvector",
    "bm25s",
    "sentence-transformers",
    "torch",
    "trl",
    "peft",
    "accelerate",
    "bitsandbytes",
    "vllm",
    "datasets",
    "httpx",
    "pydantic",
    "pyyaml",
    "tqdm",
    "rich",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "black",
    "pre-commit",
]
ml = [
    "torch",
    "transformers",
    "sentence-transformers",
    "trl",
    "peft",
    "accelerate",
    "bitsandbytes",
    "vllm",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
warn_return_any = true

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__"]